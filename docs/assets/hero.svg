<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400" role="img" aria-label="ecc-workflow: a Claude Code skill with six human approval gates">
  <title>ecc-workflow</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#111a2e"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#a7f3d0"/>
    </linearGradient>
    <radialGradient id="glowA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="400" rx="26" fill="url(#bg)"/>
  <rect width="1200" height="400" rx="26" fill="url(#grid)"/>
  <circle cx="1070" cy="70" r="240" fill="url(#glowA)"/>
  <circle cx="120" cy="360" r="220" fill="url(#glowB)"/>

  <g font-family="ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="72" y="96" fill="#34d399" font-size="17" font-weight="600" letter-spacing="5">CLAUDE CODE SKILL</text>
    <text x="68" y="196" fill="url(#title)" font-size="82" font-weight="750" letter-spacing="-2">ecc-workflow</text>
    <text x="72" y="248" fill="#94a3b8" font-size="23">Empty folder in. Reviewed, tested, released product out.</text>

    <text x="72" y="304" fill="#fbbf24" font-size="17" font-weight="600">Six human gates — no application code until G2 and G3</text>

    <g font-size="17" font-weight="600">
      <rect x="72" y="322" width="152" height="44" rx="12" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="148" y="350" fill="#a7f3d0" text-anchor="middle">G1 · Scope</text>

      <rect x="238" y="322" width="164" height="44" rx="12" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="320" y="350" fill="#a7f3d0" text-anchor="middle">G2 · Preview</text>

      <rect x="416" y="322" width="140" height="44" rx="12" fill="#34d399" fill-opacity="0.10" stroke="#34d399" stroke-opacity="0.45"/>
      <text x="486" y="350" fill="#a7f3d0" text-anchor="middle">G3 · Plan</text>

      <rect x="570" y="322" width="116" height="44" rx="12" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="628" y="350" fill="#c7d2fe" text-anchor="middle">G4 · CI</text>

      <rect x="700" y="322" width="116" height="44" rx="12" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="758" y="350" fill="#c7d2fe" text-anchor="middle">G5 · PR</text>

      <rect x="830" y="322" width="158" height="44" rx="12" fill="#818cf8" fill-opacity="0.12" stroke="#818cf8" stroke-opacity="0.45"/>
      <text x="909" y="350" fill="#c7d2fe" text-anchor="middle">G6 · Release</text>
    </g>

    <text x="1128" y="386" fill="#64748b" font-size="15" text-anchor="end">github.com/eliozh/ecc-workflow</text>
  </g>
</svg>
